# Project i18n overrides merge over the module's i18n/en.yaml.
# Only the keys below are changed; everything else falls through to Blowfish.
article:
  # "18 mins" -> "18 min". The metadata line is a drafting annotation
  # (2023-02-24 · 18 min · Cloud), and the abbreviated unit is not pluralised.
  reading_time:
    one: "{{ .Count }} min"
    other: "{{ .Count }} min"
