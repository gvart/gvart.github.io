# -- Theme parameters --
# Full rewrite: every Clarity param was theme-specific and is inert here.

# -- Appearance --
# The Drawing Set scheme lives at assets/css/schemes/drawing-set.css.
# head.html resolves it with `lower`, so the filename must be lowercase.
colorScheme = "drawing-set"

# Dark-first: the drafting ground IS the identity, so it must not be
# overridden by the reader's OS setting. The switcher stays enabled as a
# legibility escape hatch (and because appearance.js reads a stale
# localStorage "appearance" value BEFORE checking data-auto-appearance, so a
# prior visit could otherwise drop a reader into an undesigned light mode).
defaultAppearance = "dark"
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
enableStyledScrollbar = true

# The a11y panel injects an iOS-style toggle widget that is off-idiom; the
# design meets WCAG AA on its own.
enableA11y = false

replyByEmail = false

mainSections = ["post", "tutorial"]

# Feeds the home-page JSON-LD in schema.html, and acts as the
# <meta name="keywords"> fallback for pages with no tags.
keywords = ["software design", "java", "kotlin", "spring boot", "graalvm", "aws", "serverless"]

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false
hotlinkFeatureImage = false
fingerprintAlgorithm = "sha512"

# NOTE: `defaultSocialImage` is intentionally unset. Clarity's equivalent
# (fallBackOgImage) pointed at a file that never existed, which is the bug
# this migration fixes -- so it is left unset rather than pointed at the
# 	logo. Per-post social images come from each bundle's featured.* resource.

# X/Twitter handle. Consumed by Hugo's _internal/twitter_cards.html, which
# requires site.Params.social to be a MAP (it calls reflect.IsMap on it).
# Clarity's flat `twitter = "@..."` param would NOT work.
[seo]
  # Blowfish defaults to ["summary", "description", "site"], which lets a page's
  # `summary` win <meta name="description"> while og:description keeps using
  # `description` -- two different descriptions on the same page. Reversed so
  # each field has exactly one job: `description` drives both meta tags,
  # `summary` only drives the post card, list pages and the search overlay.
  metaDescriptionOrder = ["description", "summary", "site"]

[social]
  twitter = "@VladlenGladis"

[header]
  # `basic` is the only non-fixed layout. The fixed variants assume a
  # lg:top-[140px] TOC offset and .anchor{top:-150px}; the drawing set puts
  # the title block on the sheet rather than floating over it.
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # `custom` is Blowfish's officially reserved user hook: layouts/index.html
  # dispatches to partials/home/<layout>.html and the theme ships no
  # home/custom.html. No index.html override is needed.
  layout = "custom"

  # Consumed by layouts/partials/home/custom.html.
  displayLine = "Deep dives on the JVM"
  tagline = "notes from the runtime — native images, cold starts, and the parts of Spring nobody documents"
  sheetRef = "sheet 01 / index"
  indexLabel = "recent"
  showMoreLabel = "all posts"
  showRecentItems = 10
  showMoreLinkDest = "/post/"

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false            # single-author site; a byline on every sheet is noise
  showAuthorBottom = false
  showHero = false              # no photographic hero in a drawing set
  showBreadcrumbs = true        # a drawing set is navigated by reference
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showWordCount = false         # would add a 4th field to the metadata line
  showTableOfContents = true    # 7 h2s across 789 lines
  showRelatedContent = true
  relatedContentLimit = 2
  showTaxonomies = true         # required to surface categories/tags at all
  showCategories = true
  showTags = true               # tag chips on the card, below the metadata line
  showZenMode = false           # the design IS the reading mode
  seriesOpened = false
  externalLinkForceNewTab = true

  # REQUIRED for layouts/partials/comments.html to render at all. Absent from
  # Blowfish's own default AND example params.toml, and defaults to false --
  # single.html emits a warnf and renders nothing without it.
  showComments = true

  sharingLinks = ["linkedin", "bluesky", "email"]

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true            # summary paragraph under the tag chips
  showTableOfContents = false
  showCards = true              # thumbnail + bordered card, restyled as a plate
  cardView = false              # `true` routes to the image-top grid instead
  constrainItemsWidth = false   # cards need the full measure for the thumbnail
  groupByYear = false           # with 3 posts, year headings outweigh the entries
  orderByWeight = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = true
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = true
  showTableOfContents = false
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false

# -- Comments (giscus) --
# Consumed by the project's layouts/partials/comments.html. Blowfish has no
# built-in giscus support.
# mapping = "pathname" MUST NOT change: existing GitHub Discussions threads
# are keyed on the URL path.
[giscus]
  repo = "gvart/gvart.github.io"
  repoId = "R_kgDOI50yCQ"
  category = "General"
  categoryId = "DIC_kwDOI50yCc4C6jjW"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  lang = "en"
  lightTheme = "light"
  darkTheme = "dark"

[umamiAnalytics]
  websiteid = "2350b7fe-b771-4692-aca8-e7be2172db02"
  domain = "cloud.umami.is"
  dataDomains = "gvart.dev"
  enableTrackEvent = true
  doNotTrack = false